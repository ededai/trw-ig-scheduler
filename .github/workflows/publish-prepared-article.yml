name: Publish Prepared Article

# Publishes a prepared /news/ article bundle (see tools/publish_prepared_article.py).
# Fires when a bundle's publish/PUBLISH trigger file is pushed, or manually.

on:
  push:
    paths:
      - 'assets/*/publish/PUBLISH'
  workflow_dispatch:
    inputs:
      bundle:
        description: 'Bundle folder, e.g. assets/news-coe-cat-a-b-merger-2026-10-08'
        required: true
        type: string
      status:
        description: 'WP status'
        required: false
        default: 'publish'
        type: choice
        options: [publish, draft]

permissions:
  contents: write

concurrency:
  group: publish-prepared-article
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Resolve bundle
        id: bundle
        run: |
          if [ -n "${{ inputs.bundle }}" ]; then
            echo "dir=${{ inputs.bundle }}" >> "$GITHUB_OUTPUT"
            echo "status=${{ inputs.status }}" >> "$GITHUB_OUTPUT"
          else
            f=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} -- 'assets/*/publish/PUBLISH' | head -1)
            if [ -z "$f" ]; then echo "::error::No PUBLISH trigger in this push"; exit 1; fi
            echo "dir=$(dirname "$(dirname "$f")")" >> "$GITHUB_OUTPUT"
            echo "status=$(awk 'NR==1{print $1}' "$f")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to WordPress
        id: wp
        env:
          WORDPRESS_API_URL:  ${{ secrets.WORDPRESS_API_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_PASSWORD: ${{ secrets.WORDPRESS_PASSWORD }}
        run: python3 tools/publish_prepared_article.py "${{ steps.bundle.outputs.dir }}" --status "${{ steps.bundle.outputs.status || 'publish' }}"

      - name: Check live URL
        if: success()
        run: |
          sleep 5
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.wp.outputs.link }}")
          echo "HTTP $code for ${{ steps.wp.outputs.link }}"
          echo "::notice::HTTP $code ${{ steps.wp.outputs.link }}"

      - name: Commit result
        if: success()
        run: |
          git config user.name  "trw-ig-scheduler-bot"
          git config user.email "actions@users.noreply.github.com"
          git add "${{ steps.bundle.outputs.dir }}/publish/result.json"
          git commit -m "chore: publish result for ${{ steps.bundle.outputs.dir }}" || exit 0
          git push

      - name: Notify Telegram
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID:   ${{ secrets.TG_CHAT_ID }}
          STATUS:       ${{ job.status }}
          LINK:         ${{ steps.wp.outputs.link }}
          BUNDLE:       ${{ steps.bundle.outputs.dir }}
        run: |
          python3 <<'PYEOF'
          import os, urllib.request, urllib.parse
          token = (os.environ.get("TG_BOT_TOKEN") or "").strip()
          chat  = (os.environ.get("TG_CHAT_ID") or "").strip()
          if not token or not chat:
              raise SystemExit(0)
          icon = "✅" if os.environ.get("STATUS") == "success" else "❌"
          msg = f"{icon} <b>TRW article published</b>\n{os.environ.get('BUNDLE','')}\n{os.environ.get('LINK','')}"
          data = urllib.parse.urlencode({"chat_id": chat, "text": msg, "parse_mode": "HTML"}).encode()
          urllib.request.urlopen(urllib.request.Request(
              f"https://api.telegram.org/bot{token}/sendMessage", data=data, method="POST"), timeout=10)
          PYEOF
